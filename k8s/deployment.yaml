apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-web
  namespace: cicd-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-web
  template:
    metadata:
      labels:
        app: cicd-web
    spec:
      containers:
        - name: cicd-web
          image: asia-northeast3-docker.pkg.dev/project-1d9090e3-554c-41b0-b7e/cicd-study/cicd-web:v3
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5